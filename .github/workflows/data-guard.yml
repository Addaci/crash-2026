name: Data guard

# Refuses any push or pull request that would publish archive images, data,
# ground truth or secrets. See .github/scripts/data_guard.py.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for restricted material
        run: python .github/scripts/data_guard.py
